# Copy this file and package-refresh.sh to the adopting repository's .ai-team/
# directory in one owner-reviewed commit. The values are deliberately plain
# text rather than shell syntax: package-refresh.sh parses only these two keys and
# never executes this file.
#
# Before migrating from activate.sh, follow "Refresh the mount explicitly" in
# the package README. AI_TEAM_EXCLUSIVE_REFRESH_MIGRATION=1 is only the owner's
# attestation that every pre-mutex claim client is already stopped; it does not
# create technical exclusion. Recovery likewise uses only the exact SHA named
# by package-refresh.sh, never deletion of a fixed branch by name.
source=https://github.com/BelimbingApp/ai-team.git
ref=package-mount
