name: independent review

# Copy this file into an adopting repository at .github/workflows/. The
# privileged workflow fetches only the mounted grammar from the exact trusted
# commit that supplied this workflow; it never checks out pull-request code.
# Review submissions do not trigger the privileged workflow: a
# pull_request_review run executes pull-request-controlled workflow code, which
# could publish the same required-check name. Use the trusted rerun helper after
# a review changes instead.
# That grammar fetches immutable REST author/head identity; never classify a PR
# from github.actor, which is the reviewer on review-triggered runs.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-gate:
    name: Independent review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Materialize trusted review grammar
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_GATE_REPOSITORY: ${{ github.repository }}
          REVIEW_GATE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          REVIEW_GATE_DIR: docs/ai-team/scripts
        run: |
          set -euo pipefail
          [[ "$REVIEW_GATE_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$REVIEW_GATE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVIEW_GATE_DIR" == "docs/ai-team/scripts" ]]

          # The grammar and its trusted-author helper travel together: both are
          # fetched from the exact commit that supplied this workflow, blob-
          # verified, and placed side by side so review_gate.sh can source the
          # helper relative to itself exactly as it does inside the mount.
          for name in review_gate.sh _trusted_author.sh; do
            path="$REVIEW_GATE_DIR/$name"
            response="$RUNNER_TEMP/$name.json"
            script="$RUNNER_TEMP/$name"
            gh api --method GET \
              -H "Accept: application/vnd.github+json" \
              "repos/$REVIEW_GATE_REPOSITORY/contents/$path" \
              -f "ref=$REVIEW_GATE_WORKFLOW_SHA" >"$response"

            jq -e --arg path "$path" '
              type == "object"
              and .type == "file"
              and .path == $path
              and .encoding == "base64"
              and ((.content | type) == "string")
              and ((.content | length) > 0)
              and ((.size | type) == "number")
              and (.size > 0 and .size <= 1048576)
              and ((.sha | type) == "string")
              and (.sha | test("^[0-9a-f]{40}$"))
            ' "$response" >/dev/null

            expected_size=$(jq -r '.size' "$response")
            expected_sha=$(jq -r '.sha' "$response")
            jq -r '.content' "$response" \
              | tr -d '\r\n' \
              | base64 --decode >"$script"

            actual_size=$(wc -c <"$script" | tr -d '[:space:]')
            [[ "$actual_size" == "$expected_size" ]]
            [[ "$(git hash-object --no-filters "$script")" == "$expected_sha" ]]
            [[ "$(head -n 1 "$script")" == '#!/usr/bin/env bash' ]]
            bash -n "$script"
            chmod 700 "$script"
          done

      - name: Verify independent review of this exact head
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_GATE_REPOSITORY: ${{ github.repository }}
          REVIEW_GATE_PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Accounts no agent lane ever posts through, as <numeric-id>:<login>
          # separated by whitespace or commas. Their exact-head APPROVED review
          # counts as one independent acceptance with no body markers. Empty
          # means the exception is off, which is the default. Keep this in step
          # with .ai-team/principals so CI and a local gate.sh pre-flight agree.
          AI_TEAM_HUMAN_PRINCIPALS: ""
        run: |
          "$RUNNER_TEMP/review_gate.sh" "$REVIEW_GATE_PR_NUMBER" "$REVIEW_GATE_HEAD_SHA"
