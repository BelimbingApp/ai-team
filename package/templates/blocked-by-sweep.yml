name: AI Team blocked-by sweep

# Copy this adopter-owned workflow to .github/workflows/. The mechanism suite
# already runs on every pull request. Issue closure wakes the trusted sweep
# without creating a PR check or checking out a pull-request head. The schedule
# remains a backstop for cross-repository blockers and missed events.
#
# Prefer an AI Team GitHub App installation token (#621) when
# AI_TEAM_GITHUB_APP_ID / AI_TEAM_GITHUB_APP_PRIVATE_KEY exist. Optional
# AI_TEAM_BLOCKED_BY_SWEEP_TOKEN is a legacy shared-user PAT for cross-repo
# private blockers until the App is live. Otherwise keep the default Actions
# GITHUB_TOKEN (same-repository / public dependency baseline); inaccessible
# cross-repo reads already fail closed inside the sweep.
on:
  issues:
    types: [closed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-team-blocked-by-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Unblock resolved tasks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the adopter
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Choose the sweep credential
        id: credentials
        env:
          AI_TEAM_GITHUB_APP_ID: ${{ secrets.AI_TEAM_GITHUB_APP_ID }}
          AI_TEAM_GITHUB_APP_PRIVATE_KEY: ${{ secrets.AI_TEAM_GITHUB_APP_PRIVATE_KEY }}
          AI_TEAM_BLOCKED_BY_SWEEP_TOKEN: ${{ secrets.AI_TEAM_BLOCKED_BY_SWEEP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$AI_TEAM_GITHUB_APP_ID" && -n "$AI_TEAM_GITHUB_APP_PRIVATE_KEY" ]]; then
            echo "source=app" >> "$GITHUB_OUTPUT"
          elif [[ -n "$AI_TEAM_BLOCKED_BY_SWEEP_TOKEN" ]]; then
            echo '::warning::AI_TEAM_GITHUB_APP_ID / AI_TEAM_GITHUB_APP_PRIVATE_KEY are not configured; sweeping with the shared-user PAT AI_TEAM_BLOCKED_BY_SWEEP_TOKEN until the App exists (#621, docs/ai-team/runbooks/ai-team-github-app.md).'
            echo "source=pat" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::AI_TEAM_GITHUB_APP_ID / AI_TEAM_GITHUB_APP_PRIVATE_KEY are not configured; sweeping with the default Actions GITHUB_TOKEN until the App exists (#621, docs/ai-team/runbooks/ai-team-github-app.md). Inaccessible cross-repo Blocked-By references fail closed in the sweep.'
            echo "source=github" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint AI Team GitHub App installation token
        id: app-token
        if: steps.credentials.outputs.source == 'app'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AI_TEAM_GITHUB_APP_ID }}
          private-key: ${{ secrets.AI_TEAM_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run the Blocked-By sweep
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          # App when minted; optional legacy PAT; else default Actions token (#621).
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.AI_TEAM_BLOCKED_BY_SWEEP_TOKEN || github.token }}
        run: python3 docs/ai-team/scripts/blocked_by_sweep.py
