name: AI Team blocked-by sweep

# Copy this adopter-owned workflow to .github/workflows/. The mechanism suite
# already runs on every pull request. Issue closure wakes the trusted sweep
# without creating a PR check or checking out a pull-request head. The schedule
# remains a backstop for cross-repository blockers and missed events.
#
# Cross-repo Blocked-By references (BelimbingApp/blb-people#N and
# BelimbingApp/blb-people-connector#N) need an installation token whose App
# can read Issues on those repos and write Issues on this board. Mint a fresh
# token each run from AI_TEAM_GITHUB_APP_ID / AI_TEAM_GITHUB_APP_PRIVATE_KEY
# (#621). Until those secrets exist the sweep falls back to the shared-user PAT
# AI_TEAM_BLOCKED_BY_SWEEP_TOKEN with a warning; revoke it once the App is live.
on:
  issues:
    types: [closed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-team-blocked-by-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Unblock resolved tasks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the adopter
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Choose the sweep credential
        id: credentials
        env:
          AI_TEAM_GITHUB_APP_ID: ${{ secrets.AI_TEAM_GITHUB_APP_ID }}
          AI_TEAM_GITHUB_APP_PRIVATE_KEY: ${{ secrets.AI_TEAM_GITHUB_APP_PRIVATE_KEY }}
          AI_TEAM_BLOCKED_BY_SWEEP_TOKEN: ${{ secrets.AI_TEAM_BLOCKED_BY_SWEEP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$AI_TEAM_GITHUB_APP_ID" && -n "$AI_TEAM_GITHUB_APP_PRIVATE_KEY" ]]; then
            echo "source=app" >> "$GITHUB_OUTPUT"
          elif [[ -n "$AI_TEAM_BLOCKED_BY_SWEEP_TOKEN" ]]; then
            echo '::warning::AI_TEAM_GITHUB_APP_ID / AI_TEAM_GITHUB_APP_PRIVATE_KEY are not configured; sweeping with the shared-user PAT AI_TEAM_BLOCKED_BY_SWEEP_TOKEN until the App exists (#621, docs/ai-team/runbooks/ai-team-github-app.md).'
            echo "source=pat" >> "$GITHUB_OUTPUT"
          else
            echo '::error::Configure AI_TEAM_GITHUB_APP_ID and AI_TEAM_GITHUB_APP_PRIVATE_KEY (see docs/ai-team/runbooks/ai-team-github-app.md); cross-repo Blocked-By references cannot be resolved without a credential.'
            exit 1
          fi

      - name: Mint AI Team GitHub App installation token
        id: app-token
        if: steps.credentials.outputs.source == 'app'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AI_TEAM_GITHUB_APP_ID }}
          private-key: ${{ secrets.AI_TEAM_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run the Blocked-By sweep
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          # App token when minted; the retired PAT only until the App exists (#621).
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.AI_TEAM_BLOCKED_BY_SWEEP_TOKEN }}
        run: python3 docs/ai-team/scripts/blocked_by_sweep.py
