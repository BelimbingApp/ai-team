name: independent review

# Copy this file into an adopting repository at .github/workflows/. The
# privileged workflow fetches only the mounted grammar from the exact trusted
# commit that supplied this workflow; it never checks out pull-request code.
# Review submissions do not trigger the privileged workflow: a
# pull_request_review run executes pull-request-controlled workflow code, which
# could publish the same required-check name. Use the trusted rerun helper after
# a review changes instead.
# That grammar fetches immutable REST author/head identity; never classify a PR
# from github.actor, which is the reviewer on review-triggered runs.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  review-gate:
    name: Independent review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Materialize trusted review grammar
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_GATE_REPOSITORY: ${{ github.repository }}
          REVIEW_GATE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          REVIEW_GATE_DIR: docs/ai-team/scripts
        run: |
          set -euo pipefail
          [[ "$REVIEW_GATE_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$REVIEW_GATE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVIEW_GATE_DIR" == "docs/ai-team/scripts" ]]

          # The grammar and its trusted-author helper travel together: both are
          # fetched from the exact commit that supplied this workflow, blob-
          # verified, and placed side by side so review_gate.sh can source the
          # helper relative to itself exactly as it does inside the mount.
          for name in review_gate.sh _trusted_author.sh subtree_pull_gate.sh; do
            path="$REVIEW_GATE_DIR/$name"
            response="$RUNNER_TEMP/$name.json"
            script="$RUNNER_TEMP/$name"
            gh api --method GET \
              -H "Accept: application/vnd.github+json" \
              "repos/$REVIEW_GATE_REPOSITORY/contents/$path" \
              -f "ref=$REVIEW_GATE_WORKFLOW_SHA" >"$response"

            jq -e --arg path "$path" '
              type == "object"
              and .type == "file"
              and .path == $path
              and .encoding == "base64"
              and ((.content | type) == "string")
              and ((.content | length) > 0)
              and ((.size | type) == "number")
              and (.size > 0 and .size <= 1048576)
              and ((.sha | type) == "string")
              and (.sha | test("^[0-9a-f]{40}$"))
            ' "$response" >/dev/null

            expected_size=$(jq -r '.size' "$response")
            expected_sha=$(jq -r '.sha' "$response")
            jq -r '.content' "$response" \
              | tr -d '\r\n' \
              | base64 --decode >"$script"

            actual_size=$(wc -c <"$script" | tr -d '[:space:]')
            [[ "$actual_size" == "$expected_size" ]]
            [[ "$(git hash-object --no-filters "$script")" == "$expected_sha" ]]
            [[ "$(head -n 1 "$script")" == '#!/usr/bin/env bash' ]]
            bash -n "$script"
            chmod 700 "$script"
          done

      # Trusted checkout for the subtree-pull shape check (#61): the BASE
      # repository at the base SHA — never the pull request's code. PR-side
      # commits are then fetched as git OBJECTS only and read with plumbing;
      # nothing from the pull request executes in this privileged workflow.
      - name: Check out trusted base for shape verification
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: true

      # A pure, verifiable subtree pull needs no adopter-side agent review —
      # its content already passed the package repository's own gate before
      # reaching the split branch (#61). The exemption is OPT-IN with one
      # source of truth: the adopter-committed `.ai-team/subtree-pull` file
      # (`<upstream-repo> <branch> <prefix>`), read from the TRUSTED BASE
      # checkout — the same file gate.sh reads, so the two paths cannot
      # disagree and copying this template changes no adopter's policy.
      # Exit 0 marks the exemption; exit 1 (not the shape) and exit 2
      # (cannot judge) both fall through to the ordinary review requirement —
      # the exemption fails closed, never open.
      - name: Recognize a trusted subtree pull
        id: pull_shape
        env:
          PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "trusted=false" >> "$GITHUB_OUTPUT"
          if [[ ! -r .ai-team/subtree-pull ]]; then
            echo "no .ai-team/subtree-pull on the trusted base — exemption not enabled" >&2
            exit 0
          fi
          read -r pull_upstream pull_branch pull_prefix < .ai-team/subtree-pull || true
          if [[ -z "${pull_upstream:-}" || -z "${pull_branch:-}" || -z "${pull_prefix:-}" ]]; then
            echo "malformed .ai-team/subtree-pull — exemption not enabled" >&2
            exit 0
          fi
          [[ "$PULL_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PULL_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch -q --no-tags origin "+refs/pull/$PULL_NUMBER/head:refs/shape-check/head"
          [[ "$(git rev-parse refs/shape-check/head)" == "$PULL_HEAD_SHA" ]] || {
            echo "fetched PR head does not match the event head; not judging" >&2
            exit 0
          }
          if "$RUNNER_TEMP/subtree_pull_gate.sh" "$PULL_BASE_SHA" "$PULL_HEAD_SHA" \
              "$pull_prefix" "$pull_upstream" "$pull_branch"; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify independent review of this exact head
        if: steps.pull_shape.outputs.trusted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_GATE_REPOSITORY: ${{ github.repository }}
          REVIEW_GATE_PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/review_gate.sh" "$REVIEW_GATE_PR_NUMBER" "$REVIEW_GATE_HEAD_SHA"

      - name: Record the trusted-pull exemption
        if: steps.pull_shape.outputs.trusted == 'true'
        run: |
          echo "Trusted subtree pull — content was reviewed upstream behind the package gate; no adopter-side review required (#61)." >> "$GITHUB_STEP_SUMMARY"
