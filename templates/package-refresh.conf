# Copy this file and activate.sh to the adopting repository's .ai-team/
# directory in one owner-reviewed commit. The values are deliberately plain
# text rather than shell syntax: activate.sh parses only these two keys and
# never executes this file.
#
# Before a legacy first migration, follow "Activate and refresh the mount" in
# the package README. AI_TEAM_EXCLUSIVE_FIRST_REFRESH=1 is only the owner's
# attestation that every pre-mutex claim client is already stopped; it does not
# create technical exclusion. Recovery likewise uses only the exact SHA named
# by activate.sh, never deletion of a fixed branch by name.
source=https://github.com/BelimbingApp/ai-team.git
ref=package-mount
