name: mechanisms

# The package gates itself with the mechanisms it ships. gate.sh derives the
# checks it expects from the latest merged pull-request head, so any job intended
# to gate pull requests must run on `pull_request`; a job that runs only on the
# default branch cannot be required of a pull request by the gate.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mechanisms-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: Mechanism tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the package
        uses: actions/checkout@v5

      - name: Run the mechanism suite
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  shell:
    name: Shell lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the package
        uses: actions/checkout@v5

      # Errors only, deliberately. The mechanisms carry ~10 pre-existing
      # info/warning findings and several `# shellcheck source=` directives
      # that name the mounted path (docs/ai-team/scripts/...) rather than
      # this one. Ratcheting the severity down is tracked, not silent.
      - name: Run shellcheck over the mechanisms
        run: shellcheck --severity=error scripts/*.sh
