name: independent review

# This check deliberately reads the trusted default-branch copy of the grammar
# through the GitHub Contents API. It never checks out a pull-request ref in
# this privileged workflow, so a fork cannot make the checked code executable.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-gate:
    name: Independent review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve trusted review grammar
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/review_gate.json"
          error="$RUNNER_TEMP/review_gate.error"
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/review_gate.sh?ref=${DEFAULT_BRANCH}" >"$response" 2>"$error"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -q "HTTP 404" "$error"; then
              echo "present=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$error" >&2
            exit "$status"
          fi
          if ! jq -e '.encoding == "base64" and (.content | type == "string")' "$response" >/dev/null; then
            echo "unexpected review grammar response" >&2
            exit 1
          fi
          jq -r '.content' "$response" | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/review_gate.sh"
          chmod +x "$RUNNER_TEMP/review_gate.sh"
          if [ -x "$RUNNER_TEMP/review_gate.sh" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "review grammar was not materialized" >&2
            exit 1
          fi

      - name: Verify independent review of this exact head
        if: steps.resolve.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/review_gate.sh" "${{ github.event.pull_request.number }}" "${{ github.event.pull_request.head.sha }}"

      - name: Grammar not yet on the default branch
        if: steps.resolve.outputs.present == 'false'
        run: echo "review grammar is not on the default branch yet; nothing to evaluate" >> "$GITHUB_STEP_SUMMARY"
