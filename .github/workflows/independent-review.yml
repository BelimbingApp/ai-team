name: independent review

# This check deliberately checks out the trusted default-branch copy of the
# grammar. A PR cannot weaken review_gate.sh in the same change that the check
# evaluates.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-gate:
    name: Independent review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted review grammar
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify independent review of this exact head
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/review_gate.sh "${{ github.event.pull_request.number }}" "${{ github.event.pull_request.head.sha }}"
